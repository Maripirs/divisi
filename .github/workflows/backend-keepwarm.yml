name: Backend keep-warm

# Pings the Backend's /health every ~10 minutes so Render's free plan
# (render.yaml: `plan: free`) doesn't spin the instance down after its
# ~15-minute idle window. A cold start costs the next real visitor 30s+,
# which on the guest join page (/join/[code]) surfaced as an "access
# error" or the "something went wrong" card that a refresh then fixed.
#
# Caveats of using GitHub's scheduler for this:
#   - `schedule` fires on a best-effort basis and is often delayed 5-15
#     min under load, so the real gap between pings can exceed Render's
#     idle window occasionally. It cuts cold starts down a lot, it does
#     not guarantee zero. Render Starter ($7/mo, no spin-down) is the
#     only hard fix.
#   - GitHub disables scheduled workflows after 60 days with no repo
#     activity. Any push re-arms it.
#
# Needs no secrets: the health URL is public.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

# A slow run (waiting out a cold start) should not stack up behind the
# next scheduled tick.
concurrency:
  group: backend-keepwarm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # --max-time 180 so a cold start (this very ping is what wakes the
      # instance) still resolves within the step instead of timing out.
      # --retry covers a transient blip during the boot window. A genuine
      # multi-minute outage still fails the job, which is useful signal.
      - name: Ping /health
        run: |
          curl --fail --show-error --silent \
               --max-time 180 \
               --retry 3 --retry-delay 15 --retry-all-errors \
               https://divisi.onrender.com/health
