name: Backend keep-alive

# Render's free plan spins the Backend down after ~15 minutes with no HTTP
# traffic, and the next request pays a cold-start cost (container boot +
# this app's own startup migration) before it can answer — a guest opening
# a shared piece/join-code link during that window sees a blank page while
# the SSR `load()` on the Frontend waits on (or times out on) a Backend
# that isn't listening yet. See Frontend/plan.md's log for the real
# incident this fixed.
#
# A ping every 5 minutes keeps an instance always warm, so nobody hits a
# cold start at all. The interval is deliberately well under the 15-minute
# idle window: GitHub's scheduler runs cron workflows late (or skips runs)
# under load, especially on the hour and during US-daytime peak, so a
# 10-minute nominal interval was in practice drifting past 15 and letting
# the Backend sleep. That is how the "30s white screen first thing in the
# morning" slipped through. Cheap and reversible: delete this file to stop.
# The Frontend also degrades a cold start to a spinner now (see
# `Frontend/src/routes/+layout.server.ts`), so a missed ping is no longer
# catastrophic, just slower.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET /health
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://divisi.onrender.com/health)
          echo "status: $status"
          [ "$status" = "200" ]
