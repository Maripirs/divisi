name: Divisi
options:
  bundleIdPrefix: com.maripaz.divisi
  deploymentTarget:
    iOS: "17.0"
targets:
  Divisi:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: DivisiKit
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maripaz.divisi.Divisi
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: WZWT86647J
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
