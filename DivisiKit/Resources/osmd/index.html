<!DOCTYPE html>
<!--
  Host page for OpenSheetMusicDisplay (MIT license,
  https://github.com/opensheetmusicdisplay/opensheetmusicdisplay), loaded
  into a WKWebView by OSMDWebView.swift (M4). Vendored locally rather than
  from a CDN so the score renders offline and without an ATS exception.

  Swift → JS: `divisiLoadScore(xml)`, `divisiSetCursorTimestamp(wholeNotes)`.
  JS → Swift: `window.webkit.messageHandlers.divisi.postMessage({type, ...})`
  with `type` one of "ready" | "error" | "seek".
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    html, body { margin: 0; padding: 0; background: #ffffff; }
    #osmd-container { width: 100%; }
  </style>
  <script src="opensheetmusicdisplay.min.js"></script>
</head>
<body>
  <div id="osmd-container"></div>
  <script>
    let osmd = null;
    let container = document.getElementById("osmd-container");
    let tapToSeekEnabled = false;
    let defaultZoom = 0.85;

    function post(message) {
      window.webkit.messageHandlers.divisi.postMessage(message);
    }

    function divisiInit() {
      osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("osmd-container", {
        autoResize: true,
        drawTitle: false,
        followCursor: false,
      });
    }

    /// Loads and renders a new MusicXML document, resetting the cursor to
    /// the first note. Called once per voice-part/view-mode selection or
    /// file load — re-called on every load, not diffed against the
    /// previous score.
    async function divisiLoadScore(xml, zoom = defaultZoom) {
      try {
        if (!osmd) divisiInit();
        osmd.Zoom = zoom;
        await osmd.load(xml);
        osmd.render();
        osmd.cursor.show();
        if (tapToSeekEnabled) divisiInstallTapHandler();
        post({ type: "ready" });
      } catch (e) {
        post({ type: "error", message: String(e) });
      }
    }

    function divisiSetZoom(zoom) {
      if (!osmd) return;
      osmd.Zoom = zoom;
      osmd.render();
      osmd.cursor.show();
    }

    /// Moves the cursor to sit on whichever voice entry is current at
    /// `wholeNotes` (a position in the score measured in whole notes from
    /// the start — the same unit `cursor.iterator.currentTimeStamp` reports
    /// natively). Comparing by timestamp rather than a step count works
    /// the same whether one part or all four are loaded: a multi-part
    /// score's cursor advances through the union of every part's event
    /// timestamps, which has no fixed relationship to any single part's own
    /// note count. OSMD's cursor only supports stepping via
    /// next()/previous()/reset(), so this replays from whichever end is
    /// closer rather than jumping directly.
    function divisiSetCursorTimestamp(wholeNotes) {
      if (!osmd || !osmd.cursor) return;
      const current = () => osmd.cursor.iterator.currentTimeStamp.RealValue;
      if (Math.abs(current() - wholeNotes) < 1e-6) return;

      if (wholeNotes < current()) {
        osmd.cursor.reset();
        osmd.cursor.show();
      }
      let attempts = 0;
      while (current() < wholeNotes && !divisiIteratorEndReached() && attempts < 10000) {
        osmd.cursor.next();
        attempts++;
      }
    }

    function divisiIteratorEndReached() {
      if (!osmd || !osmd.cursor || !osmd.cursor.iterator) return true;
      const iterator = osmd.cursor.iterator;
      return Boolean(iterator.EndReached ?? iterator.endReached);
    }

    function divisiInstallTapHandler() {
      if (container.dataset.divisiTapHandler === "installed") return;
      container.dataset.divisiTapHandler = "installed";
      container.addEventListener("click", (event) => {
        const wholeNotes = divisiTimestampForClick(event);
        if (wholeNotes == null || !Number.isFinite(wholeNotes)) return;
        post({ type: "seek", wholeNotes });
      });
    }

    function divisiTimestampForClick(event) {
      if (!osmd || !osmd.GraphicSheet) return null;
      const svg = container.querySelector("svg");
      if (!svg || !svg.getScreenCTM) return null;

      const svgPoint = svg.createSVGPoint();
      svgPoint.x = event.clientX;
      svgPoint.y = event.clientY;
      const localPoint = svgPoint.matrixTransform(svg.getScreenCTM().inverse());
      const graph = osmd.GraphicSheet;
      const osmdPoint = graph.svgToOsmd
        ? graph.svgToOsmd({ x: localPoint.x, y: localPoint.y })
        : { x: localPoint.x / 10, y: localPoint.y / 10 };
      const timestamp =
        graph.tryGetTimeStampFromPosition?.(osmdPoint)
        ?? graph.tryGetTimestampFromPosition?.(osmdPoint)
        ?? null;
      return divisiFractionRealValue(timestamp);
    }

    function divisiFractionRealValue(value) {
      if (value == null) return null;
      if (typeof value === "number") return value;
      if (typeof value.RealValue === "number") return value.RealValue;
      if (typeof value.realValue === "number") return value.realValue;
      if (typeof value.numerator === "number" && typeof value.denominator === "number" && value.denominator !== 0) {
        return value.numerator / value.denominator;
      }
      if (typeof value.Numerator === "number" && typeof value.Denominator === "number" && value.Denominator !== 0) {
        return value.Numerator / value.Denominator;
      }
      return null;
    }

    /// Hides the cursor and clears the score for the "no file loaded" /
    /// "no notes for this voice part" states.
    function divisiClear() {
      if (osmd && osmd.cursor) osmd.cursor.hide();
    }
  </script>
</body>
</html>
