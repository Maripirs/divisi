# Render Blueprint for the Divisi backend (FastAPI + fluidsynth).
# https://render.com/docs/blueprint-spec
#
# Deploys Backend/Dockerfile as a free web service. Postgres is NOT declared
# here — see Backend/plan.md B9: using Neon's free Postgres instead of
# Render's own (Render's free Postgres auto-expires after 30 days; Neon's
# free tier doesn't). Set DATABASE_URL manually to the Neon connection
# string when creating the service from this blueprint.
#
# Storage note (see B9, and B11's fixtures_dir addition): the free plan has
# no persistent disk, so STORAGE_DIR's contents (render cache, OMR job
# scratch, the object-storage read cache) are wiped on every
# restart/redeploy. That's fine — they all regenerate. Durable
# user-uploaded piece files instead go to Neon Object Storage (S3-compatible,
# `uploads` bucket on the `production` branch), enabled by the AWS_* env
# vars below; see app/storage/files.py. Bundled/demo pieces are baked into
# the image at Backend/fixtures/ by the Dockerfile and need neither.
#
# The four AWS_* vars come from a Neon storage credential (Console -> Branch
# -> Credentials, scopes storage:read + storage:write). Unset them to fall
# back to local-disk storage.
#
# dockerContext stays ./Backend, not the repo root: the actual deployed
# service has its own `rootDir: Backend` set (a dashboard-level setting
# this Blueprint doesn't control), which prefixes onto dockerContext — so
# a repo-root context here would really mean Backend/ twice. Keeping
# fixture files inside Backend/ (rather than reaching across to the
# sibling Fixtures/) sidesteps that entirely instead of fighting it.

services:
  - type: web
    name: divisi-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # set manually to the Neon connection string
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_DIR
        value: /srv/data/storage
      - key: AWS_ENDPOINT_URL_S3
        sync: false # from the Neon storage credential
      - key: AWS_ACCESS_KEY_ID
        sync: false # from the Neon storage credential (token_id)
      - key: AWS_SECRET_ACCESS_KEY
        sync: false # from the Neon storage credential (s3_secret_access_key)
      - key: AWS_REGION
        value: us-east-2
      - key: S3_BUCKET
        value: uploads
