[pytest]
testpaths = tests
addopts = -q -n auto
markers =
    integration: needs an external binary or service (e.g. the fluidsynth executable); deselect with -m "not integration"
filterwarnings =
    ignore:builtin type (SwigPy\w+|swigvarlink) has no __module__ attribute:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
