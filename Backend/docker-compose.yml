services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: divisi
      POSTGRES_PASSWORD: divisi
      POSTGRES_DB: divisi
    ports:
      - "5432:5432"
    volumes:
      - divisi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divisi"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dev-only web UI for browsing the Postgres data directly (tables/rows,
  # ad-hoc SQL) — not part of the app itself, nothing depends on it.
  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://divisi:divisi@postgres:5432/divisi
      # Public demo join code, not a secret (it's on the /welcome page).
      # .dockerignore excludes .env from this build context entirely, so
      # this is the only way the container ever sees it locally, keeping
      # docker-compose behavior matching prod (Render has the same var).
      DEMO_JOIN_CODE: DEMOSATB
      # Docker Desktop on macOS doesn't reliably forward native filesystem
      # change events across the bind-mount virtualization layer, so
      # watchfiles (uvicorn --reload's file watcher) never sees an edit
      # without this: it falls back to polling instead of OS notifications.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/storage:/srv/data/storage
      # Local dev only: bind-mounts live source over the image's baked-in
      # copy, so a Backend edit reloads automatically (uvicorn --reload
      # below) instead of needing `docker compose up -d --build` for
      # every code change. Still needs a rebuild for a new dependency in
      # pyproject.toml, and a plain restart (not rebuild) to pick up a
      # new migration, since `alembic upgrade head` only runs once, at
      # container startup.
      - ./app:/srv/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  divisi_postgres_data:
