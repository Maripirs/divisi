[project]
name = "divisi-backend"
version = "0.1.0"
description = "Divisi backend: OMR pipeline + group/user accounts and sync"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "mido>=1.3",
    "pymupdf>=1.24",
    "music21>=9.1",
    "httpx>=0.27",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-xdist>=3.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.rendering" = ["resources/*.sf2"]
