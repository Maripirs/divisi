<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!-- Two pre-rendered raster variants (accent-recolored from the source
	     divisi-logo, same #4f46e5 / #818cf8 tokens as app.css) swapped via
	     prefers-color-scheme, since a static favicon can't read the page's
	     CSS custom properties the way the in-app Logo.svelte mask does. -->
	<style>
		.fav-dark { display: none; }
		@media (prefers-color-scheme: dark) {
			.fav-light { display: none; }
			.fav-dark { display: inline; }
		}
	</style>
	<image class="fav-light" href="data:image/png;base64," width="64" height="64" />
	<image class="fav-dark" href="data:image/png;base64," width="64" height="64" />
</svg>
